<!DOCTYPE html>
<html>
<head>
    <title>Live AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #121212; color: white; }
        .warning-banner { background: #ff9800; color: #000; padding: 10px; text-align: center; border-radius: 5px; margin-bottom: 20px; font-weight: bold; transition: 0.3s; }
        .container { display: flex; gap: 20px; height: 85vh; }
        .video-section { flex: 2; }
        .video-feed { border: 2px solid #333; border-radius: 12px; width: 100%; height: 100%; object-fit: cover; background: #000; }
        .stats-panel { flex: 1; background: #1e1e1e; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        .stat-card { background: #2d2d2d; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .score-big { font-size: 48px; font-weight: bold; color: #00e676; }
        .metric-label { color: #888; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .pause-btn { background: #ffa000; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .end-btn { background: #d32f2f; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .pause-btn:hover { opacity: 0.9; } .end-btn:hover { background: #b71c1c; }
        
        /* FIX: Strict container for the chart */
        .chart-wrapper { position: relative; height: 150px; background: #252525; border-radius: 8px; padding: 10px; border: 1px solid #333; }
        
        .red-alert { background-color: #b71c1c !important; animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, 1px); } }
    </style>
</head>
<body>
    <div class="warning-banner" id="top-alert">SESSION ACTIVE: ALL SENSORS ENGAGED</div>
    <div class="container">
        <div class="video-section">
            <img src="/video_feed" class="video-feed">
        </div>
        <div class="stats-panel">
            <h2 style="margin: 0; color: #aaa; font-size: 14px; text-transform: uppercase;">STUDENT: {{ user }}</h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="stat-card">
                    <div class="metric-label">Focus Score</div>
                    <div class="score-big" id="score">100%</div>
                </div>
                <div class="stat-card">
                    <div class="metric-label">Productivity</div>
                    <div class="score-big" id="prod" style="color: #03a9f4;">0%</div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="stat-card">
                    <div class="metric-label">Focus Time</div>
                    <div id="focus_t" style="font-size: 24px; font-weight: bold;">0m</div>
                </div>
                <div class="stat-card">
                    <div class="metric-label">Break Time</div>
                    <div id="break_t" style="font-size: 24px; font-weight: bold;">0m</div>
                </div>
            </div>

            <div class="stat-card" id="status-box">
                <div id="status-text" style="font-weight: bold; font-size: 20px;">ACTIVE</div>
            </div>

            <div class="chart-wrapper">
                <canvas id="liveChart"></canvas>
            </div>

            <div class="btn-group">
                <button id="pauseBtn" class="pause-btn" onclick="togglePause()">TAKE A BREAK</button>
                <button class="end-btn" onclick="endSession()">STOP SESSION</button>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(20).fill(''), datasets: [{ label: 'Focus', data: Array(20).fill(100), borderColor: '#00e676', borderWidth: 2, tension: 0.4, pointRadius: 0 }] },
            options: { maintainAspectRatio: false, scales: { y: { min: 0, max: 100 }, x: { display: false } }, plugins: { legend: { display: false } } }
        });

        function togglePause() {
            fetch('/toggle_pause', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const btn = document.getElementById('pauseBtn');
                const banner = document.getElementById('top-alert');
                if (data.is_paused) {
                    btn.innerText = "RESUME SESSION";
                    btn.style.background = "#28a745";
                    banner.innerText = "CAMERA OFF - SESSION PAUSED";
                    banner.style.background = "#2196f3";
                } else {
                    btn.innerText = "TAKE A BREAK";
                    btn.style.background = "#ffa000";
                    banner.innerText = "SESSION ACTIVE: ALL SENSORS ENGAGED";
                    banner.style.background = "#ff9800";
                }
            });
        }

        setInterval(() => {
            fetch('/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('score').innerText = data.focus_score + "%";
                document.getElementById('prod').innerText = data.productivity + "%";
                document.getElementById('focus_t').innerText = data.focus_min + "m";
                document.getElementById('break_t').innerText = data.break_min + "m";
                
                const statusBox = document.getElementById('status-box');
                const statusText = document.getElementById('status-text');

                if (data.is_paused) {
                    statusBox.style.background = "#1a237e";
                    statusText.innerText = "ON BREAK";
                    liveChart.data.datasets[0].borderColor = '#2196f3';
                } else if (data.distracted) {
                    statusBox.classList.add("red-alert");
                    statusText.innerText = data.status_text.toUpperCase();
                    liveChart.data.datasets[0].borderColor = '#ff1744';
                } else {
                    statusBox.classList.remove("red-alert");
                    statusBox.style.background = "#2d2d2d";
                    statusText.innerText = "FOCUSED";
                    liveChart.data.datasets[0].borderColor = '#00e676';
                }

                const chartData = liveChart.data.datasets[0].data;
                chartData.shift(); chartData.push(data.focus_score);
                liveChart.update();
            });
        }, 1000);

        function endSession() {
            if(confirm("Are you sure you want to stop the session?")) {
                fetch('/stop_session', { method: 'POST' })
                .then(res => res.json())
                .then(() => window.location.href = "/report");
            }
        }
    </script>
</body>
</html>
