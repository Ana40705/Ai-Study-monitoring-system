<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main); 
            min-height: 100vh;
        }
        
        .warning-banner { 
            background: linear-gradient(90deg, #f59e0b, #d97706); 
            color: #fff; 
            padding: 12px; 
            text-align: center; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            font-weight: 600; 
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .container { display: flex; gap: 25px; height: calc(100vh - 100px); }
        
        /* Video Section */
        .video-section { flex: 2; display: flex; flex-direction: column; }
        .video-feed { 
            border-radius: 16px; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: #000; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Stats Panel (Glassmorphism) */
        .stats-panel { 
            flex: 1; 
            background: var(--panel-bg); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .panel-header {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .stat-card { 
            background: rgba(255,255,255,0.03); 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.05); }

        .score-big { font-size: 42px; font-weight: 700; color: var(--accent-green); line-height: 1.2; }
        .metric-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
        
        .chart-wrapper { 
            position: relative; 
            height: 160px; 
            background: rgba(0,0,0,0.2); 
            border-radius: 12px; 
            padding: 15px; 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
        
        button {
            padding: 16px; 
            font-size: 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            border: none;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .pause-btn { background: var(--accent-yellow); color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .pause-btn:hover { background: #d97706; transform: translateY(-2px); }
        
        .end-btn { background: var(--accent-red); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .end-btn:hover { background: #dc2626; transform: translateY(-2px); }
        
        .red-alert { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--accent-red) !important; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="warning-banner" id="top-alert">🟢 SESSION ACTIVE: ALL SENSORS ENGAGED</div>
    <div class="container">
        <div class="video-section">
            <img src="/video_feed" class="video-feed" alt="Live AI Camera Feed">
        </div>
        <div class="stats-panel">
            <h2 class="panel-header">STUDENT: {{ user }}</h2>
            
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="metric-label">Focus Score</div>
                    <div class="score-big" id="score">100%</div>
                </div>
                <div class="stat-card">
                    <div class="metric-label">Productivity</div>
                    <div class="score-big" id="prod" style="color: var(--accent-blue);">0%</div>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="metric-label">Focus Time</div>
                    <div id="focus_t" style="font-size: 24px; font-weight: 700; color: #fff;">0m</div>
                </div>
                <div class="stat-card">
                    <div class="metric-label">Break Time</div>
                    <div id="break_t" style="font-size: 24px; font-weight: 700; color: #fff;">0m</div>
                </div>
            </div>

            <div class="stat-card" id="status-box" style="padding: 20px;">
                <div id="status-text" style="font-weight: 700; font-size: 22px; letter-spacing: 2px;">ACTIVE</div>
            </div>

            <div class="chart-wrapper">
                <canvas id="liveChart"></canvas>
            </div>

            <div class="btn-group">
                <button id="pauseBtn" class="pause-btn" onclick="togglePause()">Take a Break</button>
                <button class="end-btn" onclick="endSession()">Stop Session</button>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: Array(20).fill(''), 
                datasets: [{ 
                    label: 'Focus', 
                    data: Array(20).fill(100), 
                    borderColor: '#10b981', 
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 3, 
                    tension: 0.4, 
                    fill: true,
                    pointRadius: 0 
                }] 
            },
            options: { 
                maintainAspectRatio: false, 
                scales: { 
                    y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }, 
                    x: { display: false } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });

        function togglePause() {
            fetch('/toggle_pause', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const btn = document.getElementById('pauseBtn');
                const banner = document.getElementById('top-alert');
                if (data.is_paused) {
                    btn.innerText = "Resume Session";
                    btn.style.background = "var(--accent-blue)";
                    btn.style.boxShadow = "0 4px 15px rgba(59, 130, 246, 0.3)";
                    banner.innerText = "⏸️ CAMERA OFF - SESSION PAUSED";
                    banner.style.background = "linear-gradient(90deg, #3b82f6, #2563eb)";
                } else {
                    btn.innerText = "Take a Break";
                    btn.style.background = "var(--accent-yellow)";
                    btn.style.boxShadow = "0 4px 15px rgba(245, 158, 11, 0.3)";
                    banner.innerText = "🟢 SESSION ACTIVE: ALL SENSORS ENGAGED";
                    banner.style.background = "linear-gradient(90deg, #f59e0b, #d97706)";
                }
            });
        }

        setInterval(() => {
            fetch('/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('score').innerText = data.focus_score + "%";
                document.getElementById('prod').innerText = data.productivity + "%";
                document.getElementById('focus_t').innerText = data.focus_min + "m";
                document.getElementById('break_t').innerText = data.break_min + "m";
                
                const statusBox = document.getElementById('status-box');
                const statusText = document.getElementById('status-text');

                if (data.is_paused) {
                    statusBox.style.background = "rgba(59, 130, 246, 0.1)";
                    statusBox.style.borderColor = "var(--accent-blue)";
                    statusText.innerText = "ON BREAK";
                    statusText.style.color = "var(--accent-blue)";
                    liveChart.data.datasets[0].borderColor = '#3b82f6';
                    liveChart.data.datasets[0].backgroundColor = 'rgba(59, 130, 246, 0.1)';
                } else if (data.distracted) {
                    statusBox.classList.add("red-alert");
                    statusText.innerText = data.status_text.toUpperCase();
                    statusText.style.color = "var(--accent-red)";
                    liveChart.data.datasets[0].borderColor = '#ef4444';
                    liveChart.data.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.1)';
                } else {
                    statusBox.classList.remove("red-alert");
                    statusBox.style.background = "rgba(255,255,255,0.03)";
                    statusBox.style.borderColor = "rgba(255,255,255,0.05)";
                    statusText.innerText = "FOCUSED";
                    statusText.style.color = "var(--text-main)";
                    liveChart.data.datasets[0].borderColor = '#10b981';
                    liveChart.data.datasets[0].backgroundColor = 'rgba(16, 185, 129, 0.1)';
                }

                const chartData = liveChart.data.datasets[0].data;
                chartData.shift(); chartData.push(data.focus_score);
                liveChart.update();
            });
        }, 1000);

        function endSession() {
            if(confirm("Are you sure you want to stop the session?")) {
                fetch('/stop_session', { method: 'POST' })
                .then(res => res.json())
                .then(() => window.location.href = "/report");
            }
        }
    </script>
</body>
</html>
