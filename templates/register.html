<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FocusLens AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color); 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main); 
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Top Left Navigation */
        .top-nav-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .top-nav-link:hover { color: var(--text-main); background: rgba(255,255,255,0.1); transform: translateX(-3px); }

        .auth-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .auth-card h2 { margin-top: 0; font-size: 26px; font-weight: 700; margin-bottom: 20px; }

        .camera-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            overflow: hidden;
            border: 4px solid var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-group { margin-bottom: 18px; text-align: left; }
        
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .form-group input:focus { outline: none; border-color: var(--accent-green); background: rgba(0,0,0,0.4); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover { background: #059669; transform: translateY(-2px); }
        .btn-submit:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

        .switch-link { display: block; margin-top: 25px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .switch-link:hover { color: var(--text-main); }
        
        #message { margin-top: 15px; font-size: 14px; font-weight: 600; min-height: 20px; color: #ef4444; }
    </style>
</head>
<body>

    <a href="/" class="top-nav-link">← Back to Home</a>

    <div class="auth-card">
        <h2>Student Registration</h2>
        
        <div class="camera-circle">
            <img src="/video_feed" alt="Camera Initialization">
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <input type="text" name="username" required placeholder="Full Name (Required)">
            </div>
            <div class="form-group">
                <input type="text" name="student_id" required placeholder="Student ID (e.g., CS-101)">
            </div>
            <div class="form-group">
                <input type="email" name="email" required pattern=".+@gmail\.com$" title="Must be a @gmail.com address" placeholder="Email Address (@gmail.com)">
            </div>
            
            <button type="submit" class="btn-submit" id="submitBtn">Capture Face & Save</button>
        </form>

        <div id="message"></div>
        <a href="/login_page" class="switch-link">Already have an account? Login</a>
    </div>

    <script>
        window.addEventListener('beforeunload', function() {
            navigator.sendBeacon('/kill_camera');
        });

        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            btn.disabled = true;
            btn.innerText = "Extracting Face Data...";
            msg.innerText = "";

            fetch('/register', {
                method: 'POST',
                body: new FormData(this)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    msg.style.color = "#10b981";
                    msg.innerText = "Registration Complete! Redirecting...";
                    setTimeout(() => window.location.href = "/login_page", 1500);
                } else {
                    msg.style.color = "#ef4444";
                    msg.innerText = data.message;
                    btn.disabled = false;
                    btn.innerText = "Capture Face & Save";
                }
            })
            .catch(() => {
                msg.style.color = "#ef4444";
                msg.innerText = "Server Error. Ensure camera is working.";
                btn.disabled = false;
                btn.innerText = "Capture Face & Save";
            });
        }
    </script>
</body>
</html>
